
name: Azure Capacity Service CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore AzureCapacityService/AzureCapacityService.csproj

      - name: Restore test dependencies
        run: dotnet restore AzureCapacityService.Tests/AzureCapacityService.Tests.csproj

      - name: Build application
        run: dotnet build AzureCapacityService/AzureCapacityService.csproj --configuration Release --no-restore

      - name: Build tests
        run: dotnet build AzureCapacityService.Tests/AzureCapacityService.Tests.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test AzureCapacityService.Tests/AzureCapacityService.Tests.csproj --configuration Release --no-build
