name: Azure Capacity Service CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Build, Unit Tests and Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Directory.Build.props enables NuGetAudit and fails restore for high/critical advisories.
      - name: Restore application dependencies (NuGet vulnerability audit)
        run: dotnet restore AzureCapacityService/AzureCapacityService.csproj

      - name: Restore test dependencies (NuGet vulnerability audit)
        run: dotnet restore AzureCapacityService.Tests/AzureCapacityService.Tests.csproj

      - name: Build application
        run: dotnet build AzureCapacityService/AzureCapacityService.csproj --configuration Release --no-restore

      - name: Build tests
        run: dotnet build AzureCapacityService.Tests/AzureCapacityService.Tests.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test AzureCapacityService.Tests/AzureCapacityService.Tests.csproj --configuration Release --no-build --filter "Category!=Integration" --logger "trx;LogFileName=unit.trx"

      - name: Run integration tests
        run: dotnet test AzureCapacityService.Tests/AzureCapacityService.Tests.csproj --configuration Release --no-build --filter "Category=Integration" --logger "trx;LogFileName=integration.trx"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: AzureCapacityService.Tests/TestResults/*.trx
          if-no-files-found: ignore
