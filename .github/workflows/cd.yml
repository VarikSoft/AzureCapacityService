name: Azure Capacity Service CD

on:
  workflow_run:
    workflows:
      - Azure Capacity Service CI
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-capacity-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Infrastructure and Application
    runs-on: ubuntu-latest

    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      # The resource group must exist before a soft-deleted Key Vault can be recovered.
      - name: Bootstrap Resource Group with Bicep
        uses: azure/bicep-deploy@v2
        with:
          type: deployment
          operation: create
          name: capacity-dev-bootstrap
          scope: subscription
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          location: swedencentral
          template-file: AzureCapacityService/iac/bootstrap.bicep

      # Recovering a soft-deleted vault is a lifecycle operation, not provisioning.
      - name: Recover soft-deleted Key Vault if needed
        uses: azure/powershell@v3
        with:
          azPSVersion: latest
          inlineScript: |
            $vaultName = 'kv-mwebwlybok3gg'
            $resourceGroupName = 'rg-azure-capacity-dev'
            $location = 'swedencentral'

            $activeVault = Get-AzKeyVault -VaultName $vaultName -ResourceGroupName $resourceGroupName -ErrorAction SilentlyContinue
            if ($null -ne $activeVault) {
              Write-Host 'Key Vault already exists; no recovery required.'
            } else {
              $deletedVault = Get-AzKeyVault -VaultName $vaultName -InRemovedState -ErrorAction SilentlyContinue
              if ($null -ne $deletedVault) {
                Write-Host "Recovering soft-deleted Key Vault $vaultName..."
                Undo-AzKeyVaultRemoval -VaultName $vaultName -ResourceGroupName $resourceGroupName -Location $location | Out-Null
                Write-Host 'Key Vault recovered.'
              } else {
                Write-Host 'No soft-deleted Key Vault found; Bicep will create it.'
              }
            }

      - name: Deploy Infrastructure using Bicep
        uses: azure/bicep-deploy@v2
        with:
          type: deployment
          operation: create
          name: capacity-dev-deployment
          scope: subscription
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          location: swedencentral
          template-file: AzureCapacityService/iac/subscription.bicep
          parameters: '{"resourceGroupName":"rg-azure-capacity-dev","appName":"capacity-variksoft-dev-2026"}'

      - name: Publish .NET Application
        run: |
          dotnet publish AzureCapacityService/AzureCapacityService.csproj \
            --configuration Release \
            --output ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: capacity-variksoft-dev-2026
          package: ./publish

      - name: Verify Application
        shell: bash
        run: |
          curl --fail --location --retry 5 --retry-delay 10 \
            https://capacity-variksoft-dev-2026.azurewebsites.net/openapi/v1.json \
            --output /dev/null
