
name: Azure Capacity Service CD

on:
  workflow_run:
    workflows:
      - Azure Capacity Service CI
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-capacity-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Infrastructure and Application
    runs-on: ubuntu-latest

    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Key Vault names remain reserved after soft-delete. Recover the existing
      # vault before the subscription-scope Bicep deployment recreates the app.
      - name: Prepare Resource Group and recover Key Vault if needed
        shell: bash
        run: |
          set -euo pipefail

          RESOURCE_GROUP="rg-azure-capacity-dev"
          LOCATION="swedencentral"
          KEY_VAULT="kv-mwebwlybok3gg"

          # Required because Key Vault recovery targets an existing Resource Group.
          az group create \
            --name "$RESOURCE_GROUP" \
            --location "$LOCATION" \
            --output none

          if az keyvault show \
            --name "$KEY_VAULT" \
            --resource-group "$RESOURCE_GROUP" \
            --query id -o tsv >/dev/null 2>&1; then
            echo "Key Vault already exists; no recovery required."
          else
            DELETED_VAULT=$(az keyvault list-deleted \
              --query "[?name=='$KEY_VAULT'].name | [0]" \
              --output tsv)

            if [ "$DELETED_VAULT" = "$KEY_VAULT" ]; then
              echo "Recovering soft-deleted Key Vault $KEY_VAULT..."
              az keyvault recover \
                --name "$KEY_VAULT" \
                --location "$LOCATION" \
                --resource-group "$RESOURCE_GROUP" \
                --output none
              echo "Key Vault recovered."
            else
              echo "No soft-deleted Key Vault found; Bicep will create it."
            fi
          fi

      - name: Deploy Infrastructure using Bicep
        shell: bash
        run: |
          az deployment sub create \
            --name capacity-dev-deployment \
            --location swedencentral \
            --template-file AzureCapacityService/iac/subscription.bicep \
            --parameters \
              resourceGroupName=rg-azure-capacity-dev \
              appName=capacity-variksoft-dev-2026

      - name: Publish .NET Application
        run: |
          dotnet publish AzureCapacityService/AzureCapacityService.csproj \
            --configuration Release \
            --output ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: capacity-variksoft-dev-2026
          package: ./publish

      - name: Verify Application
        shell: bash
        run: |
          curl --fail --location --retry 5 --retry-delay 10 \
            https://capacity-variksoft-dev-2026.azurewebsites.net/openapi/v1.json \
            --output /dev/null