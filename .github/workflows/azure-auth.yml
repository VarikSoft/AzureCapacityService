name: Azure OIDC Authentication

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify-azure-login:
    name: Verify Azure Login
    runs-on: ubuntu-latest

    steps:
      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure subscription
        run: |
          az account show \
            --query "{name:name, id:id, tenantId:tenantId}" \
            --output table

      - name: Verify resource group access
        run: |
          az group list \
            --query "[].{name:name, location:location}" \
            --output table